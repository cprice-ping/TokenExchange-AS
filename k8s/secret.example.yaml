apiVersion: v1
kind: Secret
metadata:
  name: token-as-credentials
  namespace: REPLACE_WITH_EXISTING_NAMESPACE
type: Opaque
stringData:
  TOKEN_CLIENT_ID: "<token-client-id>"
  TOKEN_CLIENT_SECRET: "<rotate-before-use>"
  P1AZ_ENVIRONMENT_ID: "<pingone-environment-id>"
  P1AZ_DECISION_ENDPOINT_ID: "<decision-endpoint-id>"
  P1AZ_WORKER_CLIENT_ID: "<worker-client-id>"
  P1AZ_WORKER_CLIENT_SECRET: "<rotate-before-use>"
